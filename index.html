<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thailand ADOFAI Ranking</title>
  <style>
    body {
      background-color: #001f3f;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 40px 10px;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 30px;
    }

    .ranking-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      background-color: rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 30px;
      max-width: 700px;
      width: 100%;
      margin: 0 auto;
      gap: 15px;
    }

    .player-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: rgba(255, 255, 255, 0.15);
      border-radius: 15px;
      width: 100%;
      padding: 15px 25px;
      text-align: left;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      transition: transform 0.2s, background-color 0.3s;
      cursor: pointer;
    }

    .player-card:hover {
      transform: scale(1.02);
      background-color: rgba(255, 255, 255, 0.25);
    }

    .player-info {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .player-card img {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      object-fit: cover;
    }

    .player-details h2 {
      font-size: 1.2rem;
      margin: 0;
    }

    .player-details p {
      margin: 3px 0;
      font-size: 0.9rem;
    }

    .player-rank {
      font-size: 1.1rem;
      font-weight: bold;
    }

    .gold { border: 2px solid gold; }
    .silver { border: 2px solid silver; }
    .bronze { border: 2px solid #cd7f32; }

    .profile-container {
      display: none;
      background-color: rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      max-width: 500px;
      margin: 0 auto;
      padding: 30px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
    }

    .profile-container img {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
    }

    .profile-container h2 {
      margin-top: 15px;
      font-size: 1.8rem;
    }

    .profile-container p {
      font-size: 1rem;
      margin: 5px 0;
    }

    button {
      margin-top: 25px;
      padding: 10px 20px;
      border: none;
      border-radius: 10px;
      background-color: #0074D9;
      color: white;
      font-size: 1rem;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    button:hover {
      background-color: #005fa3;
    }

    .clear-card {
      background: rgba(255,255,255,0.1);
      border-radius: 10px;
      padding: 10px;
      margin: 10px 0;
      text-align: left;
      position: relative;
    }

    .icon-line {
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 2px 0;
    }

    .icon-line img {
      width: 24px;
      height: 24px;
      object-fit: contain;
    }

    /* YouTube logo section */
    .yt-logo {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      width: 50px;
      height: 50px;
    }

    .yt-logo img {
      width: 50px;
      height: 50px;
      object-fit: contain;
      transition: transform 0.2s ease;
    }

    .yt-logo img:hover {
      transform: scale(1.1);
    }

  </style>
</head>
<body>
  <h1 id="title">Thailand ADOFAI Ranking</h1>

  <div class="ranking-container" id="ranking"></div>

  <div class="profile-container" id="profile"></div>

  <button id="backBtn" style="display:none;">⬅ Back to Leaderboard</button>

  <script>
    const players = [
      { name: "Neki Ch", userId: 1, score: 0.00, general: 0.00, image: "https://api.tuforums.com/cdn/images/PROFILE/9d500680-e6f7-424a-b3cf-c38f4e14abc4/original", accuracy: 0, clears: 0, top_difficulty: "N/A" },
      { name: "Mammoth_ADOFAI", userId: 2, score: 0.00, general: 0.00, image: "https://api.tuforums.com/cdn/images/PROFILE/8dbec20d-c704-4df5-9d3a-71dc310ae8fc/original", accuracy: 0, clears: 0, top_difficulty: "N/A" },
      { name: "Paper222", userId: 3, score: 0.00, general: 0.00, image: "https://api.tuforums.com/cdn/images/PROFILE/c5e3cedc-5c70-4b7d-884e-1c892ce7946d/original", accuracy: 0, clears: 0, top_difficulty: "N/A" },
      { name: "VFXER", userId: 4, score: 0.00, general: 0.00, image: "https://cdn.discordapp.com/avatars/573445035107024906/07f2eaf2553d593b37664ced1b9927a2.png", accuracy: 0, clears: 0, top_difficulty: "N/A" },
      { name: "t3ww", userId: 5, score: 0.00, general: 0.00, image: "https://yt3.googleusercontent.com/tVbp35AHt9ZWgGGRIXXJ5u1mHPB0T1XtYmf7m-BnHuDYm7c6ai-HoHx_ULYOnR9kZpFZX4Kqmw=s160-c-k-c0x00ffffff-no-rj", accuracy: 0, clears: 0, top_difficulty: "N/A" }
    ];

    const rankingDiv = document.getElementById('ranking');
    const profileDiv = document.getElementById('profile');
    const title = document.getElementById('title');
    const backBtn = document.getElementById('backBtn');

    function showLeaderboard() {
      rankingDiv.style.display = 'flex';
      profileDiv.style.display = 'none';
      backBtn.style.display = 'none';
      title.textContent = "Thailand ADOFAI Ranking";
    }

    function showProfile(player, rank) {
      rankingDiv.style.display = 'none';
      profileDiv.style.display = 'block';
      backBtn.style.display = 'inline-block';
      title.textContent = `${player.name}'s Profile`;

      profileDiv.innerHTML = `
        <img src="${player.image}" alt="${player.name}">
        <h2>${player.name}</h2>
        <p><strong>Rank:</strong> #${rank}</p>
        <p><strong>Ranked Score:</strong> ${player.score.toFixed(2)}</p>
        <p><strong>General Score:</strong> ${player.general.toFixed(2)}</p>
        <p><strong>Average X-Accuracy:</strong> ${player.accuracy}%</p>
        <p><strong>Clear Amount:</strong> ${player.clears}</p>
        <p><strong>Top Difficulty:</strong> ${player.top_difficulty}</p>
      `;

      if (!player._clears || player._clears.length === 0) return;

      const clearsContainer = document.createElement('div');
      clearsContainer.style.marginTop = "20px";
      clearsContainer.style.display = "flex";
      clearsContainer.style.flexDirection = "column";
      clearsContainer.style.gap = "10px";

      player._clears.forEach(c => {
        const acc = calcAccuracy(c.judgement);
        const scoreMtp = getScoreV2Mtp(c.judgement) * getXaccMtp(c.judgement, c.baseScore);
        const timingMtp = c.timing === "Strict" ? 1 : 0.2;
        const diffMtp = c.timing === "Strict" ? 1 : getDifficultyMultiplier(c.difficulty);
        const totalClearScore = c.baseScore * scoreMtp * timingMtp * diffMtp;

        const card = document.createElement('div');
        card.style.background = "rgba(255,255,255,0.08)";
        card.style.borderRadius = "14px";
        card.style.padding = "15px";
        card.style.display = "flex";
        card.style.alignItems = "center";
        card.style.justifyContent = "space-between";

        const left = document.createElement('div');
        left.style.textAlign = "left";

        left.innerHTML = `
            <p><strong>Level:</strong> ${c.level_name}</p>
            <p><strong>Difficulty:</strong>
                <img src="Image_Source/${c.difficulty}.png"
                    style="width:24px;height:24px;object-fit:contain;vertical-align:middle;">
            </p>
            <p><strong>Timing:</strong>
                <img src="Image_Source/${c.timing}.png"
                    style="width:24px;height:24px;object-fit:contain;vertical-align:middle;">
            </p>
            <p><strong>Accuracy:</strong> ${(acc * 100).toFixed(2)}%</p>
            <p><strong>Score:</strong> ${totalClearScore.toFixed(2)}</p>
            <p><strong>Judgement:</strong>
                <span style="color:red;">${c.judgement.tooEarly}</span> |
                <span style="color:orange;">${c.judgement.early}</span> |
                <span style="color:yellow;">${c.judgement.ePerfect}</span> |
                <span style="color:lightgreen;">${c.judgement.perfect}</span> |
                <span style="color:yellow;">${c.judgement.lPerfect}</span> |
                <span style="color:orange;">${c.judgement.late}</span>
            </p>
        `;

        const right = document.createElement('div');
        right.className = "yt-logo";

        if (c.video) {
          const ytLink = document.createElement('a');
          ytLink.href = c.video;
          ytLink.target = "_blank";

          const ytImg = document.createElement('img');
          ytImg.src = "Image_Source/yt.png";
          ytImg.alt = "YouTube link";

          ytLink.appendChild(ytImg);
          right.appendChild(ytLink);
        }

        card.appendChild(left);
        card.appendChild(right);
        clearsContainer.appendChild(card);
      });

      profileDiv.appendChild(clearsContainer);
    }

    backBtn.onclick = showLeaderboard;
    async function fetchClearsForPlayer(player) {
      const filePromises = [];
        for (let i = 1; i <= 200; i++) {
          filePromises.push(
            fetch(`./Player_Data/${i}.json`)
              .then(res => (res.ok ? res.json() : null))
              .catch(() => null)
            );
          }

      const allData = (await Promise.all(filePromises)).filter(Boolean);
      const clears = [];

      allData.forEach(data => {
        const entries = Array.isArray(data) ? data : [data];
        entries.forEach(e => {
          if (Number(e.UserId_Cleared) === Number(player.userId)) {
            clears.push(e);
          }
        });
      });

      return clears;
    }

    function getDifficultyValue(diff) {
      const tier = diff[0];
      const num = parseInt(diff.slice(1));
      const base = { P: 20, G: 20, U: 20 }[tier] || 0;
      return base + num;
    }

    function getDifficultyMultiplier(diff) {
      const tier = diff[0];
      const num = parseInt(diff.slice(1));
      if (tier === "P") return 0.966**num;
      if (tier === "G") return 0.5 * 0.966**num;
      if (tier === "U") return 0.25 * 0.9228**num;
      return 1;
    }

    async function updatePlayerStats() {
      for (const player of players) {
        const clears = await fetchClearsForPlayer(player);
        player._clears = clears;
        if (clears.length === 0) continue;

        const scores = [];
        const accs = [];
        let topDiffValue = 0;

        clears.forEach(c => {
          const acc = calcAccuracy(c.judgement);
          const scoreMtp = getScoreV2Mtp(c.judgement) * getXaccMtp(c.judgement, c.baseScore);
          const timingMtp = c.timing === "Strict" ? 1 : 0.2;
          const diffMtp = c.timing === "Strict" ? 1 : getDifficultyMultiplier(c.difficulty);
          const totalScore = c.baseScore * scoreMtp * timingMtp * diffMtp;
          scores.push(totalScore);
          accs.push(acc);
          topDiffValue = Math.max(topDiffValue, getDifficultyValue(c.difficulty));
        });

        const tier = topDiffValue > 40 ? "U" + (topDiffValue - 40)
                    : topDiffValue > 20 ? "G" + (topDiffValue - 20)
                    : topDiffValue > 0 ? "P" + topDiffValue : "N/A";

        scores.sort((a, b) => b - a);
        const rankingScore = scores.slice(0, 10).reduce((a, b) => a + b, 0);
        const general = scores.reduce((a, b) => a + b, 0);
        const avgAcc = (accs.reduce((a, b) => a + b, 0) / accs.length) * 100;

        player.score = rankingScore;
        player.general = general;
        player.accuracy = avgAcc.toFixed(2);
        player.clears = clears.length;
        player.top_difficulty = tier;
      }
      loadPlayers();
    }

    function loadPlayers() {
      const sorted = [...players].sort((a, b) => b.score - a.score);
      rankingDiv.innerHTML = '';
      sorted.forEach((p, i) => {
        const rank = i + 1;
        const card = document.createElement('div');
        card.className = 'player-card';
        if (rank === 1) card.classList.add('gold');
        if (rank === 2) card.classList.add('silver');
        if (rank === 3) card.classList.add('bronze');
        card.innerHTML = `
          <div class="player-info">
            <img src="${p.image}" alt="${p.name}">
            <div class="player-details">
              <h2>${p.name}</h2>
              <p>Ranked Score: ${p.score.toFixed(2)}</p>
              <p>General Score: ${p.general.toFixed(2)}</p>
            </div>
          </div>
          <div class="player-rank">#${rank}</div>
        `;
        card.onclick = () => showProfile(p, rank);
        rankingDiv.appendChild(card);
      });
    }

    const gmConst = 315;
    const start = 1, end = 50, startDeduc = 10, endDeduc = 50, pwr = 0.7;

    function calcAccuracy(j) {
      const total = j.tooEarly + j.early + j.ePerfect + j.perfect + j.lPerfect + j.late;
      if (total === 0) return 0;
      const weighted =
        j.tooEarly * 0.2 +
        j.early * 0.4 +
        j.ePerfect * 0.75 +
        j.perfect * 1 +
        j.lPerfect * 0.75 +
        j.late * 0.4;
      return weighted / total;
    }

    function tileCount(j) {
      return j.tooEarly + j.early + j.ePerfect + j.perfect + j.lPerfect + j.late;
    }

    function getScoreV2Mtp(j) {
      const misses = j.tooEarly;
      const tiles = tileCount(j);
      if (!misses) return 1.1;
      const tp = (start + end) / 2;
      const tpDeduc = (startDeduc + endDeduc) / 2;
      const am = Math.max(0, misses - Math.floor(tiles / gmConst));

      if (am === 0) return 1;
      else if (am <= start) return 1 - startDeduc / 100;
      else if (am <= tp) {
        const kOne = (Math.pow((am - start) / (tp - start), pwr) * (tpDeduc - startDeduc)) / 100;
        return 1 - startDeduc / 100 - kOne;
      } else if (am <= end) {
        const kTwo = (Math.pow((end - am) / (end - tp), pwr) * (endDeduc - tpDeduc)) / 100;
        return 1 + kTwo - endDeduc / 100;
      } else {
        return 1 - endDeduc / 100;
      }
    }

    function getXaccMtp(j, baseScore) {
      const xacc = calcAccuracy(j);
      const xacc_percentage = xacc * 100;
      if (xacc_percentage < 95) return 1;
      if (xacc_percentage < 100)
        return -0.027 / (xacc - 1.0054) + 0.513;
      if (xacc_percentage >= 100)
        return -0.0076 / (xacc - 1.0023) + 1.17;
    }

    updatePlayerStats();
  </script>
</body>
</html>
